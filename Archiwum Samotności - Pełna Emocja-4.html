                <span class="ml-auto opacity-50 shrink-0">aktywny(a) przed chwilą</span>
              </div>
              <div id="ilx-stream" class="min-h-[150px] sm:min-h-[170px] flex flex-col justify-end gap-2 py-4"></div>
              <div class="flex items-center gap-2 rounded-full ${isLight ? 'bg-zinc-100' : 'bg-white/10'} px-4 py-3">
                <span id="ilx-input" class="flex-1 text-left text-sm sm:text-base break-words"></span>
                <span class="ilx-caret">|</span>
                <span id="ilx-send" class="text-blue-500 opacity-30 font-bold transition-opacity">➤</span>
              </div>
            </div>
            <p id="ilx-after" class="mt-6 text-center font-serif-italic text-lg sm:text-2xl opacity-0 transition-opacity duration-1000"></p>
          </div>
        </div>`;

      const input = document.getElementById('ilx-input');
      const ilx = document.getElementById('ilx-stream');
      const send = document.getElementById('ilx-send');
      const after = document.getElementById('ilx-after');
      let t = 900;
      let cur = '';

      const typeStr = (str, speed = 65) => {
        Array.from(str).forEach((ch, i) => {
          schedule(() => { input.textContent += ch; send.style.opacity = '1'; audio.keyClick(); }, t + i * speed + Math.random() * 25);
        });
        t += Array.from(str).length * speed + 200;
        cur += str;
      };
      const delAll = (speed = 28) => {
        const n = Array.from(cur).length;
        for (let i = 0; i < n; i++) {
          schedule(() => {
            input.textContent = Array.from(input.textContent).slice(0, -1).join('');
            if (!input.textContent) send.style.opacity = '0.3';
            audio.keyClick(true);
          }, t + i * speed);
        }
        t += n * speed + 200;
        cur = '';
      };
      const wait = (ms) => { t += ms; };

      typeStr(drafts[0]);
      wait(1100);
      delAll();
      schedule(() => audio.sfx('breath'), t);
      wait(1300);
      typeStr(drafts[1]);
      wait(1300);
      delAll(22);
      wait(900);
      typeStr(drafts[2], 105);
      wait(700);

      schedule(() => {
        input.textContent = '';
        send.style.opacity = '0.3';
        addMeBubble(ilx, drafts[2]);
        audio.messageOut(0);
        haptic(15);
      }, t);
      t += 1700;
      schedule(() => { markSeen(ilx, `Wyświetlono ${nowStr()}`); audio.seenSigh(); }, t);
      t += 900;
      schedule(() => addDots(ilx, 'ilx', isLight), t);
      t += 1900;
      schedule(() => { removeDots('ilx'); audio.sighDown(); haptic(30); }, t);
      t += 900;
      schedule(() => {
        after.textContent = 'wyświetlone. bez odpowiedzi. jak zawsze.';
        after.style.opacity = '0.85';
      }, t);
      t += 2800;

      schedule(() => exitCurrentScene(), t - 420);
      schedule(() => runFinaleMemories(film), t);
    }

      return `<div class="scene-3d-card enter-var relative w-full max-w-md mx-auto text-center ${extra}" style="--ex:${e.ex};--ey:${e.ey};--erx:${e.erx};--ery:${e.ery};--erz:${e.erz}"><div class="depth-layer-front w-full">${inner}</div></div>`;
    }
    const afterBlock = () => `<p id="sp-after" class="text-center font-serif-italic text-lg sm:text-2xl text-zinc-100 mt-6 min-h-[2.6em] opacity-0 transition-opacity duration-700"></p>`;
    const hintBlock = (txt) => `<div id="sp-hint" class="font-mono-code text-[11px] tracking-[0.25em] uppercase text-zinc-400 mt-8">${escapeHtml(fill(txt))}</div>`;

    // dwa zdania po scenie specjalnej, potem czwarta ściana
    function playAfter(sp, t, film, hooks = {}) {
      schedule(() => {
        const a = $id('sp-after');
        if (a) { a.textContent = fill(sp.after1); a.style.opacity = '0.95'; }
        audio.sfx('heartSkip');
        audio.sfx('glassSoft', 300);
        haptic(50);
        if (hooks.a1) hooks.a1();
      }, t);
      t += 2900;
      schedule(() => { const a = $id('sp-after'); if (a) a.style.opacity = '0'; }, t - 700);
      schedule(() => {
        const a = $id('sp-after');
        if (a) { a.textContent = fill(sp.after2); a.style.opacity = '0.95'; }
        audio.sfx('sigh');
        setDesat(0.65);
        if (hooks.a2) hooks.a2();
      }, t);
      t += 3300;
      schedule(() => exitCurrentScene(), t - 420);
      schedule(() => runFourthWall(film), t);
    }

    // obsługa dotyku dla scen interaktywnych
    function interactive(onTap, autoMs, onAuto) {
      let done = false, autoT = null;
      const cleanup = () => {
        clearTimeout(autoT);
        window.removeEventListener('pointerdown', handler);
        hugCleanup = null;
      };
      const arm = (ms) => {
        clearTimeout(autoT);
        autoT = setTimeout(() => { if (!done) { done = true; cleanup(); onAuto(); } }, ms);
      };
      function handler(e) {
        if (done) return;
        if (e.target && e.target.closest && e.target.closest('button, select, input, #mute-btn')) return;
        if (onTap(e) === 'done') { done = true; cleanup(); }
      }
      window.addEventListener('pointerdown', handler);
      hugCleanup = () => { done = true; cleanup(); };
      arm(autoMs);
      return { arm, end: () => { done = true; cleanup(); } };
    }

    /* ---------- AKT III a: wspomnienia, których nie było ---------- */
    function runFinaleMemories(film) {
      const st = storyOf(film);
      document.body.classList.remove('breathe');
      // w akcie III zapada noc – także w jasnych historiach
      if (isLightFilm(film)) {
        film.themeClass.split(' ').forEach((c) => c && document.body.classList.remove(c));
        document.body.classList.add('night-fall');
      }
      hudBottomRight.textContent = 'AKT III • WSPOMNIENIA';
      timelineBar.style.width = '84%';
      audio.setMusicTone(18000, 2);
      audio.setIntensity(-1);
      audio.setHeart(54, 0.3);
      setDesat(0);

      const S = Math.min(window.innerWidth * 0.2, 120);
      const pos = [
        { x: -S, y: -S * 1.05, r: '-8deg' },
        { x: S, y: -S * 0.95, r: '6deg' },
        { x: -S * 0.9, y: S * 1.05, r: '5deg' },
        { x: S * 1.05, y: S * 0.95, r: '-7deg' }
      ];
      const style = st.memStyle || 'polaroid';
      stage.innerHTML = `
        <div class="scene-3d-card enter-var w-full max-w-xl text-center" style="--ex:0px;--ey:0px;--erx:0deg;--ery:0deg;--erz:0deg">
          <div class="${style === 'term' || style === 'file' ? 'font-mono-code text-base sm:text-xl' : 'font-hand text-2xl sm:text-3xl'} text-amber-100 px-2">${escapeHtml(fill(st.memTitle))}</div>
          <div class="polaroid-stage" id="pol-stage"></div>
          <div id="pol-after" class="font-serif-italic text-lg sm:text-2xl text-zinc-200 opacity-0 transition-opacity duration-1000 px-3"></div>
        </div>`;
      const polStage = $id('pol-stage');

      st.memories.forEach((m, i) => {
        schedule(() => {
          const p = document.createElement('div');
          p.className = `polaroid v-${style}`;
          p.style.setProperty('--px', `${pos[i].x.toFixed(0)}px`);
          p.style.setProperty('--py', `${pos[i].y.toFixed(0)}px`);
          p.style.setProperty('--pr', pos[i].r);
          p.innerHTML = `<div class="ph">${m.e}</div><div class="cap">${escapeHtml(fill(m.c))}</div>`;
          polStage.appendChild(p);
          audio.sfx(style === 'file' || style === 'term' ? 'popup' : style === 'tape' ? 'tapeStop' : style === 'sky' ? 'ding' : 'shutter');
          haptic(10);
        }, 400 + i * 1100);
      });

      schedule(() => {
        polStage.querySelectorAll('.polaroid').forEach((p) => p.classList.add('faded'));
        setDesat(0.85);
        audio.setMusicTone(900, 2);
        audio.sfx('sigh');
      }, 5300);
      schedule(() => {
        const a = $id('pol-after');
        if (a) { a.textContent = fill(st.memAfter); a.style.opacity = '0.9'; }
        audio.sfx('heartSkip');
        haptic(60);
      }, 6300);
      schedule(() => {
        polStage.querySelectorAll('.polaroid').forEach((p, i) => setTimeout(() => p.classList.add('fall'), i * 160));
        audio.whoosh(0.9, 0.18);
      }, 8000);
      schedule(() => runSpecial(film), 9800);
    }

    /* ---------- AKT III b: scena specjalna ---------- */
    function runSpecial(film) {
      const sp = storyOf(film).special;
      hudBottomRight.textContent = 'AKT III • …';
      timelineBar.style.width = '88%';
      audio.setMusicTone(18000, 2);
      audio.setIntensity(-1);
      setDesat(0.35);
      const fns = { typing: spTyping, letter: spLetter, stars: spStars, table: spTable, candles: spCandles, call: spCall, hug: spHug, seat: spSeat, voicemail: spVoicemail };
      (fns[sp.type] || spLetter)(film, sp);
    }

    function themBubble(text, isLight = false) {
      const b = document.createElement('div');
      b.className = `self-start px-4 py-2.5 rounded-2xl ${isLight ? 'bg-zinc-200 text-zinc-900' : 'bg-zinc-800 text-zinc-100'} text-sm sm:text-base font-medium max-w-[82%] slam-anim shadow-md`;
      b.textContent = text;
      return b;
    }

    // 1. czat, w którym „pisze…” pojawia się i znika
    function spTyping(film, sp) {
      audio.setHeart(56, 0.35);
      stage.innerHTML = sceneCard(`
        <div class="rounded-3xl border border-white/15 bg-zinc-950/90 text-white overflow-hidden text-left" style="text-shadow:none">
          <div class="px-4 py-3 border-b border-white/10 bg-zinc-900/80 flex items-center gap-2.5 text-xs">
            <div class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center font-black uppercase shrink-0">${escapeHtml(sp.partner[0])}</div>
            <div class="min-w-0"><div class="font-bold truncate">${escapeHtml(fill(sp.partner))}</div><div id="sp-status" class="text-[10px] opacity-60">—</div></div>
          </div>
          <div id="sp-stream" class="p-4 space-y-2.5 min-h-[36dvh] max-h-[44dvh] sm:min-h-[300px] sm:max-h-[340px] overflow-y-auto flex flex-col justify-end"></div>
        </div>${afterBlock()}`, { ey: '12vh', erx: '-35deg' });

      const stream = $id('sp-stream'), status = $id('sp-status');
      const divider = (txt) => {
        const d = document.createElement('div');
        d.className = 'self-center text-[10px] font-mono-code opacity-50 my-1';
        d.textContent = txt;
        stream.appendChild(d);
      };
      const dots = (on) => {
        if (on) {
          addDots(stream, 'spt', false);
          status.textContent = 'pisze…';
          status.className = 'text-[10px] text-emerald-400';
        } else {
          removeDots('spt');
          status.textContent = '—';
          status.className = 'text-[10px] opacity-60';
        }
      };
      let t = 500;
      schedule(() => {
        if (sp.oldDate) divider(fill(sp.oldDate));
        if (sp.oldMsg) stream.appendChild(themBubble(fill(sp.oldMsg)));
        audio.sfx('glassSoft');
      }, t);
      t += 1300;
      schedule(() => divider('dzisiaj'), t);
      t += 400;
      sp.myMsgs.forEach((m, i) => {
        schedule(() => { addMeBubble(stream, fill(m)); audio.messageOut(i); }, t);
        t += 850;
      });
      t += 900;
      schedule(() => { dots(true); audio.sfx('swell'); setDesat(0); setWarm(0.2, 1.5); haptic([20, 80, 20]); }, t);
      t += 2600;
      schedule(() => { dots(false); setWarm(0, 0.6); audio.sfx('heartSkip'); }, t);
      t += 1500;
      schedule(() => { dots(true); setWarm(0.15, 1); audio.sfx('ding'); haptic(20); }, t);
      t += 1900;
      schedule(() => {
        dots(false);
        setWarm(0, 0.3);
        status.textContent = fill(sp.lastSeen);
        status.className = 'text-[10px] text-zinc-500';
        audio.sfx('door');
        setDesat(0.5);
      }, t);
      t += 1500;
      playAfter(sp, t, film);
    }

    // 2. list (zeszyt, notatnik, terminal)
    function spLetter(film, sp) {
      audio.setHeart(50, 0.25);
      const style = sp.style || 'notebook';
      let paper;
      if (style === 'notepad') {
        paper = `<div class="win95-window text-left">
            <div class="bg-pink-600 text-white px-2 py-1 text-[10px] sm:text-[11px] font-mono-code font-bold flex justify-between gap-2"><span class="truncate">${escapeHtml(fill(sp.header))}</span><span>[X]</span></div>
            <div id="sp-letter" class="bg-white m-1 p-3 font-mono-code text-xs sm:text-sm text-black min-h-[250px] whitespace-pre-wrap" style="text-shadow:none"></div>
          </div>`;
      } else if (style === 'terminal') {
        paper = `<div class="bg-black border border-white/20 rounded-lg text-left p-4 font-mono-code text-xs sm:text-sm" style="text-shadow:none">
            <div class="text-emerald-400 mb-3 break-all">${escapeHtml(fill(sp.header))}</div>
            <div id="sp-letter" class="text-zinc-200 min-h-[200px] whitespace-pre-wrap"></div>
          </div>`;
      } else {
        paper = `<div class="font-mono-code text-[10px] tracking-[0.3em] uppercase opacity-60 text-center mb-3">${escapeHtml(fill(sp.header))}</div>
          <div class="notebook-lines rounded-sm shadow-2xl px-5 py-4 sm:p-6 -rotate-1 text-left font-hand" style="text-shadow:none; line-height:36px">
            <div id="sp-letter" class="text-xl sm:text-2xl min-h-[280px] whitespace-pre-line text-zinc-800"></div>
            <div id="sp-draw" class="text-3xl text-right opacity-0 transition-opacity duration-1000">${sp.draw || ''}</div>
          </div>`;
      }
      stage.innerHTML = sceneCard(paper + afterBlock(), { ey: '20vh', erx: '-50deg', erz: '-4deg' }, 'max-w-sm');

      const el = $id('sp-letter');
      const speed = style === 'terminal' ? 30 : 40;
      let t = 900;
      sp.lines.forEach((raw, li) => {
        const line = fill(raw);
        if (style === 'notebook') schedule(() => audio.sfx('pencil'), t);
        Array.from(line + (li < sp.lines.length - 1 ? '\n' : '')).forEach((ch, i) => {
          schedule(() => {
            if (el.isConnected) el.textContent += ch;
            if (style !== 'notebook' && i % 2 === 0) audio.keyClick();
          }, t + i * speed);
        });
        t += (line.length + 1) * speed + 450;
      });
      schedule(() => {
        const d = $id('sp-draw');
        if (d) d.style.opacity = '1';
        audio.sfx('musicBox');
      }, t);
      t += 1500;
      playAfter(sp, t, film);
    }

    // 3. gwiazdy – dotykasz, łączą się w konstelację; twoja zostaje sama
    function spStars(film, sp) {
      audio.setHeart(52, 0.3);
      setDesat(0.1);
      const pts = [[16, 30], [30, 16], [47, 24], [60, 12], [76, 22], [68, 42], [50, 46]];
      const you = [80, 80];
      stage.innerHTML = sceneCard(`
        <div class="font-serif-italic text-2xl sm:text-3xl text-zinc-100 mb-3">${escapeHtml(fill(sp.title))}</div>
        <svg id="sp-sky" viewBox="0 0 100 100" class="w-[min(86vw,400px)] mx-auto aspect-square block touch-none" style="overflow:visible">
          <g id="sp-lines"></g>
          ${pts.map((p, i) => `<g class="sky-star" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="transparent"/><circle class="sky-dot" cx="${p[0]}" cy="${p[1]}" r="1.4" fill="#fff"/></g>`).join('')}
          <g><circle class="sky-you" cx="${you[0]}" cy="${you[1]}" r="1.8" fill="#60a5fa"/><text x="${you[0]}" y="${you[1] + 7}" font-size="3.2" fill="#93c5fd" text-anchor="middle" font-family="JetBrains Mono, monospace">${escapeHtml(fill('{imie}'))}</text></g>
        </svg>
        ${hintBlock(isMobile ? 'dotykaj gwiazd po kolei' : 'klikaj gwiazdy po kolei')}
        ${afterBlock()}`, { ey: '-10vh', erx: '30deg' });

      const lines = $id('sp-lines');
      const order = [];
      let finished = false;
      const line = (a, b, cls, frac = 1) => {
        const x2 = a[0] + (b[0] - a[0]) * frac, y2 = a[1] + (b[1] - a[1]) * frac;
        lines.insertAdjacentHTML('beforeend', `<line class="${cls}" pathLength="100" x1="${a[0]}" y1="${a[1]}" x2="${x2}" y2="${y2}"/>`);
      };
      const connect = (i) => {
        if (finished || order.includes(i)) return;
        const prev = order[order.length - 1];
        order.push(i);
        document.querySelector(`.sky-star[data-i="${i}"]`)?.classList.add('lit');
        if (prev !== undefined) line(pts[prev], pts[i], 'sky-line');
        if (audio.live()) audio.bell(audio.progression[order.length % 4].arp[order.length % 4] * (order.length > 3 ? 4 : 2), audio.ctx.currentTime + 0.01, 0.05, 3);
        haptic(12);
        if (order.length === pts.length) finish();
      };
      const nextFree = () => pts.findIndex((_, i) => !order.includes(i));
      const finish = () => {
        if (finished) return;
        finished = true;
        ctl.end();
        const h = $id('sp-hint');
        schedule(() => {
          line(pts[order[order.length - 1]], you, 'sky-reach', 0.78);
          audio.sfx('glassSoft');
        }, 700);
        schedule(() => {
          if (h) h.textContent = 'zabrakło tak niewiele.';
          document.querySelector('.sky-you')?.classList.add('alone');
          audio.sfx('heartSkip');
        }, 2300);
        playAfter(sp, 4000, film);
      };
      const ctl = interactive((e) => {
        const g = e.target && e.target.closest ? e.target.closest('.sky-star') : null;
        const i = g ? parseInt(g.dataset.i, 10) : nextFree();
        if (i >= 0) connect(i);
        ctl.arm(6000);
        return finished ? 'done' : undefined;
      }, 7000, () => {
        // nikt nie dotyka – gwiazdy łączą się same
        const auto = () => {
          const i = nextFree();
          if (i < 0) return;
          connect(i);
          if (order.length < pts.length) setTimeout(auto, 420);
        };
        auto();
      });
    }

    // 4. stolik dla dwojga – zegar idzie, świeca się wypala
    function spTable(film, sp) {
      audio.setHeart(54, 0.3);
      stage.innerHTML = sceneCard(`
        <div id="sp-clock" class="font-mono-code text-5xl sm:text-6xl font-black text-amber-200 mb-1">${sp.times[0]}</div>
        <div class="font-serif-italic text-lg sm:text-2xl text-zinc-200 mb-6 px-2">${escapeHtml(fill(sp.title))}</div>
        <div class="relative mx-auto w-64 h-40 sm:w-80 sm:h-48 rounded-[50%] bg-gradient-to-b from-amber-900/80 to-amber-950/90 border border-amber-700/40 shadow-[0_30px_60px_rgba(0,0,0,0.7)]">
          <div class="absolute left-5 top-1/2 -translate-y-1/2 text-4xl"><span id="sp-steam" class="absolute -top-6 left-1 text-xl transition-opacity duration-[3000ms]">♨️</span>🍝</div>
          <div id="sp-other" class="absolute right-5 top-1/2 -translate-y-1/2 text-4xl opacity-80 transition-all duration-1000">🍽️</div>
          <div class="absolute left-1/2 bottom-1/2 -translate-x-1/2 flex flex-col items-center">
            <div class="flame" id="sp-flame"></div>
            <div class="candle" id="sp-candle" style="height:48px"></div>
          </div>
        </div>
        <div class="flex justify-between w-64 sm:w-80 mx-auto mt-2 text-3xl"><span>🧍</span><span class="opacity-40">🪑</span></div>
        ${afterBlock()}`, { ey: '15vh', erx: '-40deg' });

      let t = 1200;
      sp.times.forEach((tm, i) => {
        if (i === 0) return;
        schedule(() => {
          const c = $id('sp-clock');
          if (c) { c.textContent = tm; c.classList.remove('slam-anim'); void c.offsetWidth; c.classList.add('slam-anim'); }
          const cd = $id('sp-candle');
          if (cd) cd.style.height = `${Math.max(6, 48 - i * 10)}px`;
          if (i === 2) { const s = $id('sp-steam'); if (s) s.style.opacity = '0'; }
          audio.sfx('tick');
          if (i === sp.times.length - 1) audio.sfx('heartSkip', 200);
        }, t);
        t += 1500;
      });
      schedule(() => {
        $id('sp-flame')?.classList.add('out');
        audio.sfx('flameOut');
        setDesat(0.6);
      }, t);
      t += 1400;
      playAfter(sp, t, film, {
        a2: () => { const o = $id('sp-other'); if (o) { o.style.opacity = '0'; o.style.transform = 'translate(40px, -50%)'; } }
      });
    }

    // 5. urodziny – zdmuchujesz świeczki w ciszy
    function spCandles(film, sp) {
      audio.setHeart(54, 0.3);
      audio.setAmbience('night');
      stage.innerHTML = sceneCard(`
        <div id="sp-title" class="font-serif-italic text-2xl sm:text-3xl text-zinc-100 mb-10">${escapeHtml(fill(sp.title))}</div>
        <div class="relative mx-auto w-56 sm:w-64">
          <div class="flex justify-center gap-4 relative z-10 -mb-1">
            ${[0, 1, 2, 3, 4].map(() => `<div class="flex flex-col items-center"><div class="flame"></div><div class="candle small" style="height:34px"></div></div>`).join('')}
          </div>
          <div class="cake"><div class="cake-text font-hand">wszystkiego najlepszego</div></div>
        </div>
        ${hintBlock(isMobile ? 'dotknij ekranu i zdmuchnij świeczki' : 'kliknij, żeby zdmuchnąć świeczki')}
        ${afterBlock()}`, { ey: '15vh', erx: '-35deg' });

      const blowOut = (byYou) => {
        const flames = stage.querySelectorAll('.flame');
        if (byYou) audio.sfx('blow');
        flames.forEach((f, i) => setTimeout(() => f.classList.add('out'), (byYou ? 110 : 900) * i));
        const total = (byYou ? 110 : 900) * flames.length;
        schedule(() => {
          audio.hugEnd();
          const h = $id('sp-hint');
          if (h) h.textContent = byYou ? '…' : 'świeczki dopaliły się same.';
          const ti = $id('sp-title');
          if (ti) ti.textContent = 'cisza.';
          setDesat(0.7);
          haptic([0, 200, 120]);
        }, total + 400);
        playAfter(sp, total + 3200, film);
      };
      interactive(() => { blowOut(true); return 'done'; }, 10000, () => blowOut(false));
    }

    // 6. telefon – dzwonisz, nikt nie odbiera
    function spCall(film, sp) {
      audio.setHeart(60, 0.4);
      stage.innerHTML = sceneCard(`
        <div class="mx-auto w-full max-w-xs rounded-[2.2rem] border border-white/15 bg-gradient-to-b from-zinc-800/90 to-zinc-950/95 px-6 py-8 text-white" style="text-shadow:none">
          <div id="sp-cstatus" class="text-[11px] font-mono-code tracking-widest uppercase opacity-60 mb-6">${escapeHtml(fill(sp.hint))}</div>
          <div id="sp-avatar" class="call-avatar mx-auto">${escapeHtml(sp.avatar)}</div>
          <div class="text-2xl font-bold mt-5">${escapeHtml(fill(sp.callee))}</div>
          <div id="sp-ctimer" class="font-mono-code text-sm opacity-60 mt-1">komórka</div>
          <div id="sp-callbtn" class="call-btn mt-10 mx-auto">📞</div>
        </div>
        ${afterBlock()}`, { ey: '20vh', erx: '-45deg' });

      const status = $id('sp-cstatus'), timer = $id('sp-ctimer'), btn = $id('sp-callbtn'), av = $id('sp-avatar');
      const startCall = () => {
        status.textContent = 'dzwonię…';
        btn.classList.add('end');
        btn.textContent = '✕';
        let sec = 0;
        const rings = 4;
        for (let s = 1; s <= rings * 2 + 1; s++) {
          schedule(() => { sec++; timer.textContent = `00:${String(sec).padStart(2, '0')}`; }, s * 1100);
        }
        for (let r = 0; r < rings; r++) {
          schedule(() => {
            audio.sfx('ring');
            av.classList.remove('ringing'); void av.offsetWidth; av.classList.add('ringing');
            if (r === 2) setDesat(0.4);
          }, 600 + r * 2300);
        }
        const endAt = 600 + rings * 2300 + 300;
        schedule(() => {
          audio.sfx('sit');
          status.textContent = fill(sp.result);
          status.classList.add('text-red-400');
          timer.textContent = 'połączenie zakończone';
          btn.classList.add('dead');
          haptic([0, 120, 60, 120]);
          setDesat(0.7);
        }, endAt);
        playAfter(sp, endAt + 2200, film);
      };
      interactive(() => { startCall(); return 'done'; }, 6000, startCall);
    }

    // 7. przytulenie – przytrzymaj palec
    function spHug(film, sp) {
      audio.setMusicTone(1100, 2);
      audio.setHeart(54, 0.4);
      stage.innerHTML = sceneCard(`
        <div id="hug-title" class="font-serif-italic text-2xl sm:text-4xl text-zinc-100 mb-10 min-h-[2.5em] px-2">${escapeHtml(fill(sp.title))}</div>
        <div class="hug-ring mx-auto" id="hug-ring">${escapeHtml(sp.emoji || '🤍')}</div>
        <div id="hug-hint" class="font-mono-code text-[11px] tracking-[0.25em] uppercase text-zinc-400 mt-10">${escapeHtml(fill(sp.hint))}</div>`,
        { erx: '20deg' });

      const title = $id('hug-title'), hint = $id('hug-hint'), ring = $id('hug-ring');
      let holding = false, started = false, done = false, holdT = null, idleT = null;
      const cleanup = () => {
        window.removeEventListener('pointerdown', onDown);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        clearTimeout(holdT);
        clearTimeout(idleT);
        hugCleanup = null;
      };
      const finish = (kind) => {
        if (done) return;
        done = true;
        cleanup();
        if (kind === 'air') {
          audio.hugEnd();
          setWarm(0, 0.15);
          setDesat(0.95, true);
          ring.classList.remove('holding');
          ring.classList.add('empty');
          title.textContent = fill(sp.emptyTitle);
          hint.textContent = fill(sp.emptyHint);
          haptic([0, 300, 220]);
          schedule(() => audio.sfx('heartSkip'), 900);
        } else {
          ring.classList.add('empty');
          title.textContent = fill(sp.nobodyTitle);
          hint.textContent = fill(sp.nobodyHint);
          audio.sfx('sigh');
          setDesat(0.85);
        }
        schedule(() => exitCurrentScene(), 4600);
        schedule(() => runFourthWall(film), 5000);
      };
      const armIdle = (ms) => {
        clearTimeout(idleT);
        idleT = setTimeout(() => finish(started ? 'air' : 'nobody'), ms);
      };
      function onDown(e) {
        if (done || (e.target && e.target.closest && e.target.closest('button, select, input'))) return;
        holding = true;
        started = true;
        clearTimeout(idleT);
        audio.hugStart();
        setWarm(0.6, 3);
        setDesat(0);
        ring.classList.add('holding');
        title.textContent = fill(sp.holding);
        hint.textContent = 'nie puszczaj';
        haptic([25, 300, 25, 300, 25, 300, 25]);
        clearTimeout(holdT);
        holdT = setTimeout(() => finish('air'), 3800);
      }
      function onUp() {
        if (done || !holding) return;
        holding = false;
        clearTimeout(holdT);
        audio.hugStop(false);
        setWarm(0, 1.2);
        setDesat(0.6);
        ring.classList.remove('holding');
        title.textContent = 'nie odchodź…';
        hint.textContent = 'przytrzymaj jeszcze raz';
        armIdle(6000);
      }
      window.addEventListener('pointerdown', onDown);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
      hugCleanup = () => { done = true; cleanup(); audio.hugStop(true); setWarm(0, 0.3); };
      armIdle(10000);
    }

    // 8. wolne miejsce obok – gwar ludzi milknie
    function spSeat(film, sp) {
      audio.setHeart(56, 0.3);
      stage.innerHTML = sceneCard(`
        <div class="font-mono-code text-[10px] tracking-[0.3em] uppercase opacity-60 mb-2">${escapeHtml(fill(sp.place))}</div>
        <div class="font-serif-italic text-2xl sm:text-3xl text-zinc-100 mb-5">${escapeHtml(fill(sp.title))}</div>
        <div class="grid grid-cols-4 gap-2 sm:gap-3 max-w-[280px] mx-auto">
          ${Array.from({ length: 12 }).map(() => `<div class="seat">${sp.pair}</div>`).join('')}
        </div>
        <div class="flex justify-center gap-2 sm:gap-3 mt-5"><div class="seat me">🧍</div><div class="seat empty" id="sp-empty">💺</div></div>
        ${hintBlock(sp.hint)}
        ${afterBlock()}`, { ey: '15vh', erx: '-35deg' });

      audio.crowdStart();
      const reveal = (byYou) => {
        audio.crowdStop();
        audio.hugEnd();
        const e = $id('sp-empty');
        if (e) e.classList.add('tapped');
        const h = $id('sp-hint');
        if (h) h.textContent = byYou ? 'to miejsce jest wolne od zawsze.' : 'nikt się nie dosiadł.';
        setDesat(0.75, true);
        haptic([0, 160, 100]);
        playAfter(sp, 2600, film);
      };
      interactive(() => { reveal(true); return 'done'; }, 8500, () => reveal(false));
    }

    // 9. wiadomość głosowa
    function spVoicemail(film, sp) {
      audio.setHeart(52, 0.3);
      stage.innerHTML = sceneCard(`
        <div class="mx-auto w-full max-w-sm rounded-3xl border border-white/15 bg-zinc-900/90 p-5 text-left text-white" style="text-shadow:none">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-lg shrink-0">🔊</div>
            <div class="min-w-0"><div class="font-bold text-sm truncate">${escapeHtml(fill(sp.from))}</div><div class="text-[11px] opacity-60 font-mono-code">${escapeHtml(fill(sp.date))} • ${escapeHtml(sp.dur)}</div></div>
          </div>
          <div class="vm-wave" id="sp-wave">${Array.from({ length: 30 }).map(() => `<span style="--h:${(20 + Math.random() * 80).toFixed(0)}%; animation-delay:${(Math.random() * 0.6).toFixed(2)}s"></span>`).join('')}</div>
          <div class="h-1 bg-white/10 rounded-full overflow-hidden my-4"><div id="sp-prog" class="h-full bg-emerald-400" style="width:0%; transition: width linear"></div></div>
          <div id="sp-trans" class="font-serif-italic text-base sm:text-lg text-zinc-200 space-y-1.5 min-h-[140px]"></div>
        </div>
        ${afterBlock()}`, { ey: '15vh', erx: '-40deg' });

      const per = 2300;
      const total = sp.lines.length * per + 600;
      let t = 700;
      schedule(() => {
        audio.sfx('beep');
        audio.sfx('tapeHiss', 300);
        $id('sp-wave')?.classList.add('playing');
        const p = $id('sp-prog');
        if (p) { p.style.transitionDuration = `${total}ms`; p.style.width = '100%'; }
      }, t);
      t += 500;
      sp.lines.forEach((ln) => {
        schedule(() => {
          const tr = $id('sp-trans');
          if (!tr) return;
          const d = document.createElement('div');
          d.className = 'fourth-wall';
          d.innerHTML = `<span class="line" style="animation-duration:1.2s">${escapeHtml(fill(ln))}</span>`;
          tr.appendChild(d);
        }, t);
        t += per;
      });
      schedule(() => {
        $id('sp-wave')?.classList.remove('playing');
        audio.sfx('beep');
        const tr = $id('sp-trans');
        if (tr) tr.insertAdjacentHTML('beforeend', '<div class="font-mono-code text-[11px] opacity-50 not-italic mt-2">— koniec wiadomości —</div>');
      }, t);
      t += 1300;
      playAfter(sp, t, film);
    }

    /* ---------- AKT III c: czwarta ściana ---------- */
    function runFourthWall(film) {

      stage.innerHTML = `
        <div class="scene-3d-card enter-var text-center max-w-lg mx-auto px-4 fourth-wall" style="--ex:0px;--ey:0px;--erx:0deg;--ery:0deg;--erz:0deg">

    /* ---------- AKT III d: cios ---------- */
    function runAct3Finale(film) {
      const st = storyOf(film);

      audio.preTwist(3.2, true);

      schedule(() => {
        setDesat(0, true);
        audio.twistImpact(true);
        bigHitVisuals(true);
        spawnLensTears(isMobile ? 6 : 9, 6000);
        schedule(() => dimLayer.classList.remove('on'), 1800);
        schedule(() => letterbox(false), 3500);
        schedule(() => setDesat(0.45), 5000);

        const forName = USER.name ? `<div class="font-mono-code text-[10px] tracking-[0.4em] opacity-50 -mt-2 mb-4">— DLA: ${escapeHtml(USER.nameUp)} —</div>` : '';
        stage.innerHTML = `
          <div id="finale-screen" class="scene-3d-card enter-var text-center max-w-2xl mx-auto px-4" style="--ex:0px;--ey:0px;--erx:30deg;--ery:0deg;--erz:0deg">
            <div class="depth-layer-glow absolute inset-10 rounded-full bg-red-600/25 pointer-events-none"></div>
            <div class="depth-layer-front">
              <div class="text-xl sm:text-2xl font-serif-italic opacity-75 mb-2">każdy może znaleźć miłość</div>
              <h1 class="text-5xl sm:text-8xl font-black tracking-tighter my-5 sm:my-6 uppercase leading-none">${extrudedText('(OPRÓCZ CIEBIE)')}</h1>
              ${forName}

            </div>
          </div>`;
        typewriter($id('finale-line'), fill(st.finaleSub), 1600, 40);
        schedule(() => audio.outro(), 4200);
        if (EPILOGUE_ENABLED) {
          schedule(() => runEpilogue(film), 14000);
        } else {
          startHold(film, [
            'niektóre historie nie mają szczęśliwego zakończenia.',

    /* ---------- EPILOG: ktoś jednak pisze ---------- */
    function runEpilogue(film) {
      const st = storyOf(film);

      audio.setMusicTone(1200, 3);
      audio.setHeart(56, 0.35);
      fx.setTears(false);
      schedule(() => {
        $id('notif-icon').textContent = st.epi.av;
        $id('notif-app').textContent = fill(st.epi.app);
        $id('notif-title').textContent = fill(st.epi.contact);
        const b = $id('notif-body');
        b.textContent = fill(st.epi.msgs[0]);
        b.style.display = '';
        notifEl.classList.remove('sad');
        notifEl.classList.add('show');
        audio.sfx('vibrate');
        audio.sfx('notif', 150);
        haptic([40, 80, 40]);
        schedule(() => notifEl.classList.remove('show'), 3600);

      schedule(() => exitCurrentScene(), 4300);

    function runEpilogueChat(film) {
      const st = storyOf(film);
      audio.setMode('major');
      audio.setIntensity(0);
      audio.setMusicTone(18000, 4);
      audio.setAmbience('none');
      setDesat(0);
      setWarm(0.18, 3);
      letterbox(false);

      stage.innerHTML = `
        <div class="chat-3d-wrapper w-full max-w-md mx-auto">
          <div class="relative rounded-3xl border border-amber-300/40 bg-zinc-950/90 text-white backdrop-blur-xl overflow-hidden shadow-[0_0_80px_rgba(251,191,36,0.25)] scene-3d-card enter-var" style="--ex:0px;--ey:10vh;--erx:-30deg;--ery:0deg;--erz:0deg">
            <div class="px-4 sm:px-5 py-3 border-b border-white/10 bg-zinc-900/80 flex items-center gap-2.5 text-xs">
              <div class="w-8 h-8 rounded-full bg-amber-300/20 text-amber-200 flex items-center justify-center font-black shrink-0">${st.epi.av}</div>
              <div class="min-w-0">
                <div class="font-bold truncate">${escapeHtml(fill(st.epi.contact))}</div>
                <div class="text-[10px] opacity-60 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span> aktywny(a) teraz</div>
              </div>
              <span class="ml-auto font-mono-code opacity-60 shrink-0">${escapeHtml(nowStr())}</span>
            </div>
            <div id="epi-stream" class="p-4 sm:p-5 space-y-3 min-h-[40dvh] max-h-[50dvh] sm:min-h-[340px] overflow-y-auto flex flex-col justify-end" style="text-shadow:none"></div>
          </div>
        </div>`;

      const stream = $id('epi-stream');
      let t = 600;
      st.epi.msgs.forEach((m, i) => {
        schedule(() => addDots(stream, `epi${i}`, false), t);
        t += 1500;
        schedule(() => {
          removeDots(`epi${i}`);
          const b = document.createElement('div');
          b.className = 'self-start px-4 py-2.5 rounded-2xl bg-amber-100 text-zinc-900 text-sm sm:text-base font-medium max-w-[82%] slam-anim shadow-[0_0_24px_rgba(251,191,36,0.35)]';
          b.textContent = fill(m);
          stream.appendChild(b);
          stream.scrollTop = stream.scrollHeight;
          audio.messageIn(i + 1);
          haptic(14);
          setWarm(0.18 + i * 0.05, 1.5);
        }, t);
        t += 1600;
      });
      t += 900;
      schedule(() => { addMeBubble(stream, fill(st.epi.reply)); audio.messageOut(0); haptic(20); }, t);
      t += 2400;
      schedule(() => exitCurrentScene(), t - 420);
      schedule(() => runEpilogueFinal(film), t);
    }

    function runEpilogueFinal(film) {
      const st = storyOf(film);
      timelineBar.style.width = '100%';
      hudBottomRight.textContent = 'TERAZ';
      const nawet = USER.name ? `(nawet ty, ${USER.name})` : '(nawet ty)';
      stage.innerHTML = `
        <div id="finale-screen" class="scene-3d-card enter-var text-center max-w-2xl mx-auto px-4" style="--ex:0px;--ey:0px;--erx:0deg;--ery:0deg;--erz:0deg">
          <div class="depth-layer-glow absolute inset-10 rounded-full bg-amber-400/25 pointer-events-none"></div>
          <div class="depth-layer-front">
            <div class="text-xl sm:text-3xl font-serif-italic opacity-90 mb-4">każdy może znaleźć miłość</div>
            <div class="text-3xl sm:text-6xl font-black uppercase leading-none tracking-tighter whitespace-nowrap">
              <span id="epi-strike" class="strike text-red-600" style="--sd:.7s">(OPRÓCZ CIEBIE)</span>
            </div>
            <div class="text-5xl sm:text-8xl font-hand gold-text mt-3 sm:mt-4 leading-tight">${letters3D(nawet, 1900, 85)}</div>
            <p id="epi-line" class="text-sm sm:text-base font-serif-italic opacity-90 max-w-md mx-auto mt-6 min-h-[4.5em] px-2"></p>
            <p id="hold-line" class="text-sm sm:text-lg font-serif-italic text-amber-100 max-w-md mx-auto mt-4 min-h-[3em] px-2 opacity-0 transition-opacity duration-1000"></p>
            <div class="font-mono-code text-[10px] tracking-[0.35em] uppercase opacity-40 mt-8" id="hold-clock"></div>
          </div>
        </div>`;

      schedule(() => audio.sfx('pencil'), 700);
      schedule(() => $id('epi-strike')?.classList.add('struck'), 900);
      schedule(() => {
        audio.setKey((film.key || 0) + 2);
        audio.setIntensity(2);
        audio.liftSwell();
        fx.rise(130);
        setWarm(0.45, 2);
        haptic([30, 120, 30, 120, 30]);
        spawnLensTears(isMobile ? 5 : 8, 5000);
      }, 1900);
      typewriter($id('epi-line'), fill(st.epiLine), 4200, 42);
      schedule(() => audio.setIntensity(1), 12000);
      schedule(() => { audio.setIntensity(-1); setWarm(0.28, 6); }, 22000);
      schedule(() => startHold(film, st.end || [], true), 9000);
    }

    /* ---------- EKRAN KOŃCOWY: zostaje na zawsze ---------- */
    function startHold(film, lines, warm) {
      let i = 0;
      const step = () => {
        const el = $id('hold-line');
        if (!el || !lines.length) return;
        el.style.opacity = '0';
        schedule(() => {
          el.textContent = fill(lines[i % lines.length]);
          el.style.opacity = '0.85';
          i++;
        }, 1100);
        schedule(step, 8000);
      };
      schedule(step, 400);
      const clock = () => {
        const c = $id('hold-clock');
        if (c) c.textContent = `teraz • ${nowStr()}${USER.name ? ' • ' + USER.nameUp : ''}`;
        schedule(clock, 15000);
      };
      clock();
      const ambient = () => {
        if (warm) fx.rise(16); else fx.burst(14, true);
        if (Math.random() < 0.5) spawnLensTears(1, 400);
        audio.sfx('glassSoft');
        schedule(ambient, 9000 + Math.random() * 5000);
      };
      schedule(ambient, 7000);
      audio.setHeart(50, warm ? 0.22 : 0.3);
    }

    /*************************************************************************
     * TELEFON: dźwięk w trybie cichym (iOS), ekran nie gaśnie, pełny ekran
     *************************************************************************/
    let wakeLock = null;
    let silentEl = null;
    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    function silentWavURL() {
      const sr = 8000, n = 4000;
      const buf = new ArrayBuffer(44 + n);
      const v = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
      w(36, 'data'); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
      return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    }
    function unlockMobileAudio() {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      try {
        if (!silentEl) {
          silentEl = document.createElement('audio');
          silentEl.src = silentWavURL();
          silentEl.loop = true;
          silentEl.setAttribute('playsinline', '');
        }
        silentEl.play().catch(() => {});
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (!audio.ctx) return;
      if (document.hidden) {
        audio.ctx.suspend();
      } else {
        audio.ctx.resume();
        requestWakeLock();
      }
    });

    /*************************************************************************
     * STEROWANIE: mysz, dotyk, żyroskop telefonu
     *************************************************************************/
    function applyTilt(rx, ry) {
      document.documentElement.style.setProperty('--rx', `${rx.toFixed(2)}deg`);
      document.documentElement.style.setProperty('--ry', `${ry.toFixed(2)}deg`);
      const chatCard = document.getElementById('chat-3d-card');
      if (chatCard && !chatCard.classList.contains('twist-zoom') && !chatCard.classList.contains('tension-push') && !chatCard.classList.contains('hope-glow')) {
        const m = isMobile ? 0.45 : 0.7;
        chatCard.style.transform = `rotateX(${(isMobile ? 8 : 12) + rx * m}deg) rotateY(${(isMobile ? -8 : -14) + ry * m}deg) rotateZ(2deg) scale(1.03)`;
      }
    }
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    window.addEventListener('mousemove', (e) => {
      applyTilt((0.5 - e.clientY / window.innerHeight) * 18, (e.clientX / window.innerWidth - 0.5) * 20);
    });
    window.addEventListener('touchmove', (e) => {
      const tch = e.touches[0];
      if (tch) applyTilt((0.5 - tch.clientY / window.innerHeight) * 14, (tch.clientX / window.innerWidth - 0.5) * 16);
    }, { passive: true });
    window.addEventListener('deviceorientation', (e) => {
      if (e.beta == null || e.gamma == null) return;
      applyTilt(clamp((45 - e.beta) * 0.35, -12, 12), clamp(e.gamma * 0.45, -14, 14));
    });

    const nameInput = document.getElementById('name-input');
    try { nameInput.value = localStorage.getItem('lonely_name') || ''; } catch (e) {}

    function beginExperience() {
      const raw = (nameInput.value || '').replace(/[<>&"{}|\\]/g, '').trim().slice(0, 18);
      USER.name = raw;
      USER.nameUp = raw.toLocaleUpperCase('pl-PL');
      try { localStorage.setItem('lonely_name', raw); } catch (e) {}
      nameInput.blur();

      audio.init();
      unlockMobileAudio();
      requestWakeLock();
      try {
        if (navigator.getBattery) navigator.getBattery().then((b) => { BATTERY = Math.round(b.level * 100); }).catch(() => {});
      } catch (e) {}
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().catch(() => {});
        }
      } catch (e) {}
      if (isMobile && document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      }
      haptic(30);
      const overlay = document.getElementById('start-overlay');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      startFilm(pickRandomFilm());
    }

    document.getElementById('start-experience-btn').addEventListener('click', beginExperience);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') beginExperience(); });




    document.getElementById('mute-btn').addEventListener('click', (e) => {
      const muted = audio.toggleMute();
      e.currentTarget.textContent = muted ? '🔇' : '🔊';
      if (muted && navigator.vibrate) { try { navigator.vibrate(0); } catch (err) {} }
    });
  </script>
